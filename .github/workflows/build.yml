name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libxkbcommon0
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  usd:
    # FreeUSD compiles a C++ extension; pip caches the wheel for the pinned commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[usd]" pytest
      - run: python -c "from gxbake.core import usd; assert usd.available()"
      - run: pytest -q tests/test_usd.py

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pyinstaller --noconfirm packaging/gxbake.spec
      - name: Smoke-test the frozen CLI
        shell: bash
        run: |
          exe=dist/GxBake; [ -f dist/GxBake.exe ] && exe=dist/GxBake.exe
          "$exe" --version
          printf 'v 0 0 0\nv 1 0 0\nv 0 1 0\nf 1 2 3\n' > smoke.obj
          "$exe" convert smoke.obj -o smoke-out
          test -s smoke-out/gc_studio/smoke.mdl
      - uses: actions/upload-artifact@v4
        with:
          name: GxBake-${{ runner.os }}
          path: |
            dist/GxBake
            dist/GxBake.exe
            dist/GxBake.app
          if-no-files-found: ignore
